name: Server card effects
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  effects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libevent-dev
      - name: Build production Linux engine and archive regression
        run: |
          cmake -S Server -B build/server -DCMAKE_BUILD_TYPE=Release -DULTRA_BUILD_EFFECT_TESTS=ON
          cmake --build build/server -j 3
      - name: Verify Beyond the Brave native effects and summon-zone routing
        env:
          ULTRA_NATIVE_DIR: build/server
        run: python3 Tests/NativeBeyondTheBraveTests.py
      - name: Verify Aluber and Branded in White through production script reader
        run: build/server/server_archive_effects "$GITHUB_WORKSPACE"
      - name: Play three-player and four-player tag turns through TCP
        run: python3 Tests/NativeUnevenTagTests.py --native build/server
      - name: Verify explicit owner duel controls through TCP
        run: python3 Tests/NativeAdminDuelTests.py build/server
      - name: Verify reported Branded hand and Aluber search through TCP
        run: python3 Tests/NativeFriendEffectsTests.py build/server
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-linux-server-effects
          path: |
            build/server/libocgcore.so
            build/server/libygoserver.so
          retention-days: 7
