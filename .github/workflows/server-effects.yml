name: Server card effects
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  effects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libevent-dev
      - name: Build production Linux engine and archive regression
        run: |
          cmake -S Server -B build/server -DCMAKE_BUILD_TYPE=Release -DULTRA_BUILD_EFFECT_TESTS=ON
          cmake --build build/server -j 3
      - name: Fetch verified released card database
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,zipfile
          from pathlib import Path
          p=Path('build/server/released-update.zip')
          urllib.request.urlretrieve('https://github.com/MatteoGXC/ultra-duel/releases/download/v0.1.6/Ultra-Duel-Update.zip',p)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='e90c46c5df7d7afbaf41627f2c6367cc036e6e17a22225a976420d88383291cd'
          with zipfile.ZipFile(p) as z:
              target=Path('Data/locales/en-US/cards.cdb');target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(str(target)))
          PY
      - name: Verify Aluber and Branded in White through production script reader
        run: build/server/server_archive_effects "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-linux-server-effects
          path: |
            build/server/libocgcore.so
            build/server/libygoserver.so
          retention-days: 7
