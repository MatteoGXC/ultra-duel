name: Verify Mac DMG
on:
  workflow_dispatch:
    inputs:
      arch:
        type: choice
        default: arm64
        options: [arm64, x86_64]
      asset_id:
        description: Private draft input asset ID
        required: true
      sha256:
        description: Input archive checksum
        required: true
      runtime_sha:
        description: Immutable runtime archive checksum for cache isolation
        default: ddd688f1b23825950afaad75fe519b953ae61c8a587ee4b9cbff8ff6c049019a
        required: true
permissions:
  # GitHub requires collaborator access to retrieve assets from an unpublished draft.
  # This workflow has no release-publishing step.
  contents: write
jobs:
  package:
    runs-on: ${{ inputs.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /LICENSE
            /Tools/MacBootstrap.swift
            /Tools/package-mac.py
            /Tools/download-verified-runtime.py
            /Tests/NativeCardScriptTests.py
            /Tests/NativeEffectDescriptionsTests.py
            /Tests/NativeBeyondTheBraveTests.py
            /Tests/NativeAdminDuelTests.py
            /Tests/MacFieldVisualCheck.swift
      - name: Download private build input
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ASSET: ${{ inputs.asset_id }}
          INPUT_SHA: ${{ inputs.sha256 }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,hashlib
          class Redirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):
              r=super().redirect_request(*args,**kwargs)
              if r:r.remove_header('Authorization')
              return r
          request=urllib.request.Request('https://api.github.com/repos/${{ github.repository }}/releases/assets/'+os.environ['INPUT_ASSET'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','User-Agent':'Ultra-Duel-private-DMG-test'})
          h=hashlib.sha256()
          with urllib.request.build_opener(Redirect()).open(request,timeout=120) as r,open('mac-input.zip','wb') as stream:
            while data:=r.read(4*1024*1024):stream.write(data);h.update(data)
          assert h.hexdigest()==os.environ['INPUT_SHA']
          PY
      - name: Assemble and sign app
        run: |
          brew list zstd >/dev/null || brew install zstd
          python3 Tools/package-mac.py --input mac-input.zip --output build/dmg
          rm mac-input.zip
          file "build/dmg/Ultra Duel.app/Contents/MacOS/Ultra Duel" "build/dmg/Ultra Duel.app/Contents/Resources/Player.app/Contents/MacOS/Ultra Duel"
      - name: Create, verify, mount and install DMG
        run: |
          hdiutil create -volname "Ultra Duel" -srcfolder build/dmg -ov -format UDZO build/Ultra-Duel-${{ inputs.arch == 'x86_64' && 'Intel' || 'Apple-Silicon' }}.dmg
          hdiutil verify build/Ultra-Duel-${{ inputs.arch == 'x86_64' && 'Intel' || 'Apple-Silicon' }}.dmg
          mkdir -p "$RUNNER_TEMP/ultra-mount" "$RUNNER_TEMP/Applications"
          hdiutil attach build/Ultra-Duel-${{ inputs.arch == 'x86_64' && 'Intel' || 'Apple-Silicon' }}.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/ultra-mount"
          ditto "$RUNNER_TEMP/ultra-mount/Ultra Duel.app" "$RUNNER_TEMP/Applications/Ultra Duel.app"
          hdiutil detach "$RUNNER_TEMP/ultra-mount"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Applications/Ultra Duel.app"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mac-runtime.tar.zst
          key: mac-runtime-${{ inputs.runtime_sha }}
      - name: Download and verify runtime archive
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP="$RUNNER_TEMP/Applications/Ultra Duel.app"
          python3 -u Tools/download-verified-runtime.py "$APP/Contents/Resources/runtime.json" "$RUNNER_TEMP/mac-runtime.tar.zst"
      - uses: actions/cache/save@v4
        if: steps.runtime.outcome == 'success'
        with:
          path: ${{ runner.temp }}/mac-runtime.tar.zst
          key: mac-runtime-${{ inputs.runtime_sha }}
      - name: Verify actual first-launch installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          manifest=json.loads((root/'Applications/Ultra Duel.app/Contents/Resources/runtime.json').read_text())
          folder=root/'card-faces';folder.mkdir(exist_ok=True)
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  request=super().redirect_request(*args,**kwargs)
                  if request:request.remove_header('Authorization')
                  return request
          for part in manifest.get('artwork',[]):
              request=urllib.request.Request(part.get('assetApi',part['url']),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','User-Agent':'Ultra-Duel-art-verification'})
              digest=hashlib.sha256()
              with urllib.request.build_opener(Redirect()).open(request,timeout=120) as response,(folder/part['name']).open('wb') as stream:
                  while block:=response.read(4*1024*1024):stream.write(block);digest.update(block)
              assert digest.hexdigest()==part['sha256']
          PY
          APP="$RUNNER_TEMP/Applications/Ultra Duel.app"
          "$APP/Contents/MacOS/Ultra Duel" --prepare-only --runtime "$RUNNER_TEMP/ultra-runtime" --offline-archive "$RUNNER_TEMP/mac-runtime.tar.zst" --offline-artwork "$RUNNER_TEMP/card-faces"
          rm "$RUNNER_TEMP/mac-runtime.tar.zst"
      - name: Run installed native Unity player
        run: |
          python3 - <<'PY'
          import os,subprocess,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);app=root/'Applications/Ultra Duel.app';player=app/'Contents/Resources/Player.app/Contents/MacOS/Ultra Duel'
          env=dict(os.environ,ULTRA_DUEL_DATA=str(root/'ultra-runtime'))
          result=subprocess.run([str(player),'-batchmode','-nographics','--mac-platform-probe',str(root/'platform-passed.txt'),'-logFile',str(root/'platform-player.log')],env=env,timeout=120)
          assert result.returncode==0
          assert (root/'platform-passed.txt').exists(),(root/'platform-player.log').read_text()[-6000:]
          print((root/'platform-passed.txt').read_text())
          PY
      - name: Audit all installed card initializers
        run: |
          APP="$RUNNER_TEMP/Applications/Ultra Duel.app"
          ULTRA_NATIVE_DIR="$APP/Contents/Resources/Player.app/Contents/Plugins" python3 Tests/NativeCardScriptTests.py --all --database "$RUNNER_TEMP/ultra-runtime/Data/locales/en-US/cards.cdb" --scripts "$RUNNER_TEMP/ultra-runtime/Data/script.zip" --output "$RUNNER_TEMP/mac-card-effects.json"
      - name: Verify installed effects, owner controls, timers and spectator packets
        run: |
          APP="$RUNNER_TEMP/Applications/Ultra Duel.app"
          export ULTRA_NATIVE_DIR="$APP/Contents/Resources/Player.app/Contents/Plugins"
          export ULTRA_TEST_CONTENT="$RUNNER_TEMP/ultra-runtime"
          python3 Tests/NativeBeyondTheBraveTests.py --database "$ULTRA_TEST_CONTENT/Data/locales/en-US/cards.cdb" --scripts "$ULTRA_TEST_CONTENT/Data/script.zip"
          python3 Tests/NativeEffectDescriptionsTests.py
          python3 Tests/NativeAdminDuelTests.py "$ULTRA_NATIVE_DIR"
          ULTRA_ADMIN_EXTENDED=1 python3 Tests/NativeAdminDuelTests.py "$ULTRA_NATIVE_DIR"
          ULTRA_ADMIN_EXTENDED=1 ULTRA_ADMIN_FIELD_ONLY=1 python3 Tests/NativeAdminDuelTests.py "$ULTRA_NATIVE_DIR"
          ULTRA_TIMER_TEST=1 python3 Tests/NativeAdminDuelTests.py "$ULTRA_NATIVE_DIR"
          ULTRA_SPECTATOR_TEST=1 python3 Tests/NativeAdminDuelTests.py "$ULTRA_NATIVE_DIR"
      - name: Verify graphical game launch
        run: |
          caffeinate -d -i -u -t 1800 &
          python3 - <<'PY'
          import os,subprocess,pathlib,threading,time
          root=pathlib.Path(os.environ['RUNNER_TEMP']);player=root/'Applications/Ultra Duel.app/Contents/Resources/Player.app/Contents/MacOS/Ultra Duel'
          env=dict(os.environ,ULTRA_DUEL_DATA=str(root/'ultra-runtime'))
          config=root/'ultra-runtime/Data/config.conf'
          lines=config.read_text(encoding='utf-8-sig').splitlines()
          lines=[line for line in lines if not line.startswith(('Background->','UltraReferenceBackgroundApplied->'))]
          config.write_text('\n'.join(lines+['Background->16','UltraReferenceBackgroundApplied->1'])+'\n',encoding='utf-8')
          command=[str(player),'-screen-width','1280','-screen-height','720','--format-smoke',str(root/'mac-ui'),'TCG','--rps-art-check','--friend-tables-layout','--ultra-features','--ultra-layout','--ultra-rewards-check','--notifications-check','--ultra-ui-pages','--deck-badges-only','-logFile',str(root/'mac-ui.log')]
          process=subprocess.Popen(command,env=env)
          def desktop_capture():
              for _ in range(1200):
                  if (root/'mac-ui/menu.png').exists():
                      subprocess.run(['screencapture','-x',str(root/'mac-ui-desktop.png')],timeout=15);return
                  if process.poll() is not None:return
                  time.sleep(.25)
          threading.Thread(target=desktop_capture,daemon=True).start()
          try:code=process.wait(timeout=120)
          except subprocess.TimeoutExpired:
              subprocess.run(['sample',str(process.pid),'5','-file',str(root/'mac-ui-sample.txt')],timeout=20)
              subprocess.run(['screencapture','-x',str(root/'mac-ui-timeout.png')],timeout=15)
              try:code=process.wait(timeout=180)
              except subprocess.TimeoutExpired:process.kill();process.wait();raise
          result=subprocess.CompletedProcess(command,code)
          assert result.returncode==0
          assert (root/'mac-ui/passed.txt').exists(),(root/'mac-ui.log').read_text()[-6000:]
          assert 'Failed to decompress' not in (root/'mac-ui.log').read_text(), 'Unsupported compressed textures in installed menu'
          PY
      - name: Verify a graphical Solo duel in the installed game
        run: |
          python3 - <<'PY'
          import os,subprocess,pathlib,threading,time
          root=pathlib.Path(os.environ['RUNNER_TEMP']);player=root/'Applications/Ultra Duel.app/Contents/Resources/Player.app/Contents/MacOS/Ultra Duel'
          env=dict(os.environ,ULTRA_DUEL_DATA=str(root/'ultra-runtime'))
          config=root/'ultra-runtime/Data/config.conf'
          lines=[line for line in config.read_text(encoding='utf-8-sig').splitlines() if not line.startswith('Background->')]
          config.write_text('\n'.join(lines+['Background->0'])+'\n',encoding='utf-8')
          process=subprocess.Popen([str(player),'-screen-width','1280','-screen-height','720','--format-smoke',str(root/'mac-duel-ui'),'TCG','--ultra-result-check','-logFile',str(root/'mac-duel-ui.log')],env=env)
          def desktop_capture():
              for _ in range(1200):
                  if (root/'mac-duel-ui/duel.png').exists():
                      subprocess.run(['screencapture','-x',str(root/'mac-duel-ui-desktop.png')],timeout=15);return
                  if process.poll() is not None:return
                  time.sleep(.25)
          threading.Thread(target=desktop_capture,daemon=True).start()
          assert process.wait(timeout=300)==0
          assert (root/'mac-duel-ui/passed.txt').exists(),(root/'mac-duel-ui.log').read_text()[-6000:]
          assert 'Failed to decompress' not in (root/'mac-duel-ui.log').read_text(), 'Unsupported compressed textures in installed duel'
          PY
      - name: Verify premade decks and revised menu layouts
        run: |
          python3 - <<'PY'
          import os,subprocess,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);player=root/'Applications/Ultra Duel.app/Contents/Resources/Player.app/Contents/MacOS/Ultra Duel'
          env=dict(os.environ,ULTRA_DUEL_DATA=str(root/'ultra-runtime'))
          for name,flag in [('mac-premades','--premade-check'),('mac-headers','--deck-header-check'),('mac-menu','--menu-layout-check')]:
              log=root/(name+'.log')
              command=[str(player),'-screen-width','1600','-screen-height','900','--format-smoke',str(root/name),'TCG',flag,'-logFile',str(log)]
              result=subprocess.run(command,env=env,timeout=300)
              assert result.returncode==0 and (root/name/'passed.txt').exists(),log.read_text()[-6000:]
          PY
      - name: Reject opaque white field overlays
        run: swift Tests/MacFieldVisualCheck.swift "$RUNNER_TEMP/mac-duel-ui/duel.png" "$RUNNER_TEMP/mac-duel-ui/damage-verified.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-installation-evidence
          path: |
            ${{ runner.temp }}/platform-passed.txt*
            ${{ runner.temp }}/platform-player.log
            ${{ runner.temp }}/mac-card-effects.json
            ${{ runner.temp }}/mac-ui*
            ${{ runner.temp }}/mac-duel-ui*
            ${{ runner.temp }}/mac-premades*
            ${{ runner.temp }}/mac-headers*
            ${{ runner.temp }}/mac-menu*
            ${{ runner.temp }}/ultra-runtime/installation.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: verified-ultra-duel-${{ inputs.arch }}-dmg
          path: build/Ultra-Duel-${{ inputs.arch == 'x86_64' && 'Intel' || 'Apple-Silicon' }}.dmg
          retention-days: 7
